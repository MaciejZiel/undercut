# Complete server block. Include it from nginx.conf inside http { } (after nginx-http.conf),
# or paste it next to the other host blocks. Check with `nginx -t` before one reload.

server {
    listen 127.0.0.1:8080;
    server_name undercut.maciejzielinski.dev;

    server_tokens off;
    limit_req_status 429;
    client_max_body_size 256k;

    # Shared proxy settings (headers are repeated per location because nginx does not
    # inherit proxy_set_header into a location that defines its own).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Next.js internal endpoints (cache revalidation). The backend calls Next directly on
    # 127.0.0.1:3110 and never through this server, so the public side has no reason to reach
    # them: refuse anything that came through the tunnel. Only a request made on the server
    # itself is let through (see $undercut_private_ok in nginx-http.conf).
    location /_internal/ {
        allow 127.0.0.1;
        deny all;
        if ($undercut_private_ok = 0) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Django admin: reachable from Tailscale or the server itself, never from the public
    # internet. `allow 100.64.0.0/10; deny all` limits the peer address, and the
    # $undercut_private_ok check closes the tunnel loophole: tunnel traffic also comes from
    # 127.0.0.1, so it is told apart by the CF-Connecting-IP header. Tight rate limit, no caching.
    location /admin/ {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        deny all;
        if ($undercut_private_ok = 0) {
            return 404;
        }
        limit_req zone=undercut_admin burst=10 nodelay;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # API
    location /api/ {
        limit_req zone=undercut_api burst=30 nodelay;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
    }

    # Django static files (admin, API docs), served by WhiteNoise in the backend.
    location /static/ {
        limit_req zone=undercut_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else: Next.js server.
    location / {
        limit_req zone=undercut_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
