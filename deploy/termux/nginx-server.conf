# Complete server block. Include it from nginx.conf inside http { } (after nginx-http.conf),
# or paste it next to the other host blocks. Check with `nginx -t` before one reload.

server {
    listen 127.0.0.1:8080;
    server_name undercut.maciejzielinski.dev;

    server_tokens off;
    limit_req_status 429;
    client_max_body_size 256k;

    # Shared proxy settings (headers are repeated per location because nginx does not
    # inherit proxy_set_header into a location that defines its own).
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Django admin: tight limit, no caching.
    location /admin/ {
        limit_req zone=undercut_admin burst=10 nodelay;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # API
    location /api/ {
        limit_req zone=undercut_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
    }

    # Django static files (admin, API docs), served by WhiteNoise in the backend.
    location /static/ {
        limit_req zone=undercut_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else: Next.js server.
    location / {
        limit_req zone=undercut_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $undercut_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
