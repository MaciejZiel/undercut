# http-level snippet: include inside the http { } block of nginx.conf (once).
# Keys on the real client address supplied by Cloudflare; falls back to the socket address
# when the header is absent. The header is only trustworthy because nginx listens on loopback
# behind the tunnel.
map $http_cf_connecting_ip $undercut_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $undercut_client zone=undercut_web:10m rate=20r/s;
limit_req_zone $undercut_client zone=undercut_api:10m rate=10r/s;
limit_req_zone $undercut_client zone=undercut_admin:10m rate=30r/m;
