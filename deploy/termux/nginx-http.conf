# http-level snippet: include inside the http { } block of nginx.conf (once).
# Keys on the real client address supplied by Cloudflare; falls back to the socket address
# when the header is absent. The header is only trustworthy because nginx listens on loopback
# behind the tunnel.
map $http_cf_connecting_ip $undercut_client {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $undercut_client zone=undercut_web:10m rate=20r/s;
limit_req_zone $undercut_client zone=undercut_api:10m rate=10r/s;
limit_req_zone $undercut_client zone=undercut_admin:10m rate=30r/m;

# Private-access gate for /admin/ and /_internal/ (used in nginx-server.conf).
# Every request that came through the Cloudflare Tunnel arrives from 127.0.0.1 too, so the peer
# address alone cannot tell the public from the owner. Cloudflare always adds CF-Connecting-IP
# (and overwrites a forged one); a request made on the server itself, or arriving over Tailscale
# (for example through `tailscale serve` or an SSH forward), has none. Allowed only when the peer
# is localhost or Tailscale (100.64.0.0/10) AND the header is empty.
geo $undercut_private_peer {
    default         0;
    127.0.0.1       1;
    100.64.0.0/10   1;
}

map "$undercut_private_peer:$http_cf_connecting_ip" $undercut_private_ok {
    default 0;
    "1:"    1;
}
