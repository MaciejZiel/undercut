      type: object
      properties:
        round:
          $ref: '#/components/schemas/PredictionRound'
        status:
          $ref: '#/components/schemas/StatusEnum'
        closes_at:
          type: string
          format: date-time
          nullable: true
        my_pick:
          allOf:
          - $ref: '#/components/schemas/MyPick'
          nullable: true
      required:
      - closes_at
      - my_pick
      - round
      - status
    RoundWinner:
      type: object
      properties:
        driver:
          $ref: '#/components/schemas/DriverRef'
        team:
          $ref: '#/components/schemas/TeamRef'
      required:
      - driver
      - team
    Runs:
      type: object
      properties:
        at:
          type: array
          items:
            type: integer
          description: Frame indexes where the value changes.
        v:
          type: array
          items:
            nullable: true
          description: Value from that frame index until the next entry.
      required:
      - at
      - v
    Search:
      type: object
      properties:
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/SearchDriver'
        constructors:
          type: array
          items:
            $ref: '#/components/schemas/SearchConstructor'
        circuits:
          type: array
          items:
            $ref: '#/components/schemas/CircuitRef'
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/SearchRound'
      required:
      - circuits
      - constructors
      - drivers
      - rounds
    SearchConstructor:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        nationality:
          type: string
          nullable: true
      required:
      - name
      - nationality
      - slug
    SearchDriver:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        code:
          type: string
          nullable: true
        number:
          type: integer
          nullable: true
        nationality:
          type: string
          nullable: true
      required:
      - code
      - name
      - nationality
      - number
      - slug
    SearchRound:
      type: object
      properties:
        year:
          type: integer
        round:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
      required:
      - date
      - name
      - round
      - year
    SeasonDetail:
      type: object
      properties:
        year:
          type: integer
        name:
          type: string
          nullable: true
        sprint_rounds:
          type: integer
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/CalendarRound'
      required:
      - name
      - rounds
      - sprint_rounds
      - year
    SeasonDriver:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        code:
          type: string
          nullable: true
        number:
          type: integer
          nullable: true
      required:
      - code
      - name
      - number
      - slug
    SeasonList:
      type: object
      description: Row of the season list; champions are null until the season is
        finished.
      properties:
        year:
          type: integer
        name:
          type: string
          readOnly: true
          nullable: true
        rounds_count:
          type: integer
          description: All rounds, cancelled included.
        cancelled_rounds:
          type: integer
        sprint_rounds:
          type: integer
        driver_champion:
          allOf:
          - $ref: '#/components/schemas/DriverRef'
          readOnly: true
          nullable: true
        constructor_champion:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          readOnly: true
          nullable: true
      required:
      - cancelled_rounds
      - constructor_champion
      - driver_champion
      - name
      - rounds_count
      - sprint_rounds
      - year
    SessionHeader:
      type: object
      properties:
        year:
          type: integer
        round:
          type: integer
        round_name:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          type: string
      required:
      - round
      - round_name
      - status
      - type
      - year
    SessionResults:
      oneOf:
      - $ref: '#/components/schemas/RaceSessionResults'
      - $ref: '#/components/schemas/QualifyingSessionResults'
    SettingsUpdateThemeEnum:
      enum:
      - system
      - light
      - dark
      type: string
      description: |-
        * `system` - system
        * `light` - light
        * `dark` - dark
    StandingRow:
      type: object
      properties:
        position:
          type: integer
          nullable: true
        position_text:
          type: string
        entity:
          $ref: '#/components/schemas/Entity'
        points:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
        wins:
          type: integer
        podiums:
          type: integer
        gap_to_leader:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
      required:
      - entity
      - gap_to_leader
      - podiums
      - points
      - position
      - position_text
      - wins
    Standings:
      type: object
      properties:
        season:
          type: integer
          nullable: true
          description: Season year.
        after_round:
          type: integer
          nullable: true
        rounds:
          type: array
          items:
            type: integer
          description: Rounds that have a table for this season.
        results:
          type: array
          items:
            $ref: '#/components/schemas/StandingRow'
      required:
      - after_round
      - results
      - rounds
      - season
    StandingsEntry:
      type: object
      properties:
        position:
          type: integer
          nullable: true
        slug:
          type: string
        name:
          type: string
        code:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Constructors only.
        points:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
        wins:
          type: integer
      required:
      - code
      - color
      - name
      - points
      - position
      - slug
      - wins
    StatEntry:
      type: object
      properties:
        driver:
          allOf:
          - $ref: '#/components/schemas/PickDriver'
          nullable: true
        count:
          type: integer
        percent:
          type: number
          format: double
      required:
      - count
      - driver
      - percent
    StatusEnum:
      enum:
      - open
      - closed
      - unavailable
      type: string
      description: |-
        * `open` - open
        * `closed` - closed
        * `unavailable` - unavailable
    Stint:
      type: object
      properties:
        stint_number:
          type: integer
        compound:
          $ref: '#/components/schemas/CompoundEnum'
        compound_letter:
          $ref: '#/components/schemas/CompoundLetterEnum'
        lap_start:
          type: integer
          nullable: true
        lap_end:
          type: integer
          nullable: true
        laps:
          type: integer
          nullable: true
          description: Stint length in laps.
        tyre_age_at_start:
          type: integer
          nullable: true
      required:
      - compound
      - compound_letter
      - lap_end
      - lap_start
      - laps
      - stint_number
      - tyre_age_at_start
    Stints:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionHeader'
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/StintsDriver'
      required:
      - drivers
      - session
    StintsDriver:
      type: object
      properties:
        driver_id:
          type: integer
        code:
          type: string
        full_name:
          type: string
        constructor_id:
          type: integer
        constructor_name:
          type: string
        color_hex:
          type: string
          nullable: true
          description: '#rrggbb, null = neutral colour.'
        position:
          type: integer
          nullable: true
          description: Final classification.
        stints:
          type: array
          items:
            $ref: '#/components/schemas/Stint'
      required:
      - code
      - color_hex
      - constructor_id
      - constructor_name
      - driver_id
      - full_name
      - position
      - stints
    TeamRef:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
          description: '#rrggbb or null (neutral colour).'
      required:
      - color
      - name
      - slug
    TeammateSeason:
      type: object
      properties:
        year:
          type: integer
        team_slug:
          type: string
        races:
          type: integer
          description: Races both started for this team.
        lap_times:
          type: array
          items:
            $ref: '#/components/schemas/LapTimeRace'
          nullable: true
          description: Null when there is no lap data, see the reason.
        lap_times_reason:
          type: string
          nullable: true
      required:
      - lap_times
      - lap_times_reason
      - races
      - team_slug
      - year
    ThisDay:
      type: object
      properties:
        year:
          type: integer
        round:
          type: integer
          nullable: true
        race:
          type: string
        date:
          type: string
          format: date
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverRef'
          description: The winner.
        team:
          $ref: '#/components/schemas/TeamRef'
      required:
      - date
      - driver
      - race
      - round
      - team
      - year
    TitleRace:
      type: object
      properties:
        season:
          type: integer
          nullable: true
        after_round:
          type: integer
          nullable: true
        rounds_remaining:
          type: integer
          nullable: true
        sprints_remaining:
          type: integer
          nullable: true
        max_points_available:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Most a single driver can still score.
        fastest_lap_point:
          type: boolean
          nullable: true
        decided:
          type: boolean
        champion:
          allOf:
          - $ref: '#/components/schemas/Entity'
          nullable: true
        decided_in_round:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
          description: '"Champion decided in round N".'
        contenders:
          type: array
          items:
            $ref: '#/components/schemas/Contender'
          description: Drivers who can still win the title.
        eliminated:
          type: integer
          description: Drivers in the table without a chance.
      required:
      - after_round
      - champion
      - contenders
      - decided
      - decided_in_round
      - eliminated
      - fastest_lap_point
      - max_points_available
      - message
      - rounds_remaining
      - season
      - sprints_remaining
    TopStandings:
      type: object
      properties:
        season:
          type: integer
          nullable: true
        after_round:
          type: integer
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StandingsEntry'
          description: Top five.
      required:
      - after_round
      - entries
      - season
    TypeEnum:
      enum:
      - RACE
      - SPRINT
      - Q
      type: string
      description: |-
        * `RACE` - RACE
        * `SPRINT` - SPRINT
        * `Q` - Q
    UnsubscribeResult:
      type: object
      properties:
        race_result_email:
          type: boolean
      required:
      - race_result_email
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
