openapi: 3.0.3
info:
  title: Undercut API
  version: 0.1.0
  description: Formula 1 stats, analytics and predictions.
paths:
  /api/v1/account/delete/:
    post:
      operationId: v1_account_delete_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteAccount'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/account/export/:
    get:
      operationId: v1_account_export_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Personal data export
  /api/v1/account/settings/:
    get:
      operationId: v1_account_settings_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_account_settings_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: Sets the ``csrftoken`` cookie. Call once on page load, before any
        unsafe request.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/demo/:
    post:
      operationId: v1_auth_demo_create
      description: Log in as the shared demo account ("Try without registering", FR-507).
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/calendar/:
    get:
      operationId: v1_calendar_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Season calendar with sessions and status
      parameters:
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
        description: 'Season year (default: the latest season with rounds).'
      tags:
      - calendar
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
          description: ''
  /api/v1/calendar/ics/:
    get:
      operationId: v1_calendar_ics_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: iCalendar export of a round or a season
      parameters:
      - in: query
        name: round
        schema:
          type: integer
          maximum: 100
          minimum: 1
        description: 'Only this round (default: all).'
      - in: query
        name: year
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
        description: 'Season year (default: the latest season with rounds).'
      tags:
      - calendar
      security:
      - {}
      responses:
        '200':
          content:
            text/calendar:
              schema:
                type: string
          description: ''
  /api/v1/circuits/:
    get:
      operationId: v1_circuits_list
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: List circuits
      parameters:
      - in: query
        name: country
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - country
          - gp_count
          - last_gp_date
          - -name
          - -country
          - -gp_count
          - -last_gp_date
          type: string
          default: name
          minLength: 1
        description: |-
          * `name` - name
          * `country` - country
          * `gp_count` - gp_count
          * `last_gp_date` - last_gp_date
          * `-name` - -name
          * `-country` - -country
          * `-gp_count` - -gp_count
          * `-last_gp_date` - -last_gp_date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
      tags:
      - circuits
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCircuitListList'
          description: ''
  /api/v1/circuits/{slug}/:
    get:
      operationId: v1_circuits_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Circuit page
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - circuits
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitDetail'
          description: ''
  /api/v1/compare/:
    get:
      operationId: v1_compare_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Compare two drivers
      parameters:
      - in: query
        name: a
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: Slug of the first driver.
        required: true
      - in: query
        name: b
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: Slug of the second driver.
        required: true
      - in: query
        name: season
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
        description: Limit the head-to-head to this season.
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compare'
          description: ''
  /api/v1/constructors/:
    get:
      operationId: v1_constructors_list
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: List constructors
      parameters:
      - in: query
        name: nationality
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: ordering
        schema:
          enum:
          - name
          - wins
          - starts
          - titles
          - -name
          - -wins
          - -starts
          - -titles
          type: string
          default: name
          minLength: 1
        description: |-
          * `name` - name
          * `wins` - wins
          * `starts` - starts
          * `titles` - titles
          * `-name` - -name
          * `-wins` - -wins
          * `-starts` - -starts
          * `-titles` - -titles
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: season
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
      tags:
      - constructors
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConstructorListList'
          description: ''
  /api/v1/constructors/{slug}/:
    get:
      operationId: v1_constructors_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Constructor history
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - constructors
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructorDetail'
          description: ''
  /api/v1/dashboard/:
    get:
      operationId: v1_dashboard_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Home page data
      tags:
      - dashboard
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/drivers/:
    get:
      operationId: v1_drivers_list
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: List drivers
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
          nullable: true
        description: Raced in the latest season with results.
      - in: query
        name: champion
        schema:
          type: boolean
          nullable: true
        description: 'true: only world champions; false: only drivers without a title.'
      - in: query
        name: constructor
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
        description: Constructor slug.
      - in: query
        name: nationality
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: ordering
        schema:
          enum:
          - family_name
          - wins
          - starts
          - titles
          - -family_name
          - -wins
          - -starts
          - -titles
          type: string
          default: family_name
          minLength: 1
        description: |-
          * `family_name` - family_name
          * `wins` - wins
          * `starts` - starts
          * `titles` - titles
          * `-family_name` - -family_name
          * `-wins` - -wins
          * `-starts` - -starts
          * `-titles` - -titles
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Case and diacritics insensitive name search.
      - in: query
        name: season
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
        description: Started in this year.
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverListList'
          description: ''
  /api/v1/drivers/{slug}/:
    get:
      operationId: v1_drivers_retrieve
      description: Anonymous GET-only access; no session lookup, so responses are
        cacheable.
      summary: Driver career
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDetail'
          description: ''
  /api/v1/favorites/:
    get:
      operationId: v1_favorites_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorites'
          description: ''
  /api/v1/favorites/constructors/{slug}/:
    put:
      operationId: v1_favorites_constructors_update
      description: PUT adds, DELETE removes; both are idempotent. Both return the
        current state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_favorites_constructors_destroy
      description: PUT adds, DELETE removes; both are idempotent. Both return the
        current state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
  /api/v1/favorites/drivers/{slug}/:
    put:
      operationId: v1_favorites_drivers_update
      description: PUT adds, DELETE removes; both are idempotent. Both return the
        current state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_favorites_drivers_destroy
      description: PUT adds, DELETE removes; both are idempotent. Both return the
        current state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
          description: ''
  /api/v1/leagues/:
    get:
      operationId: v1_leagues_list
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: My leagues
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeagueSummary'
          description: ''
    post:
      operationId: v1_leagues_create
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Create a league (max 10 per user)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeagueCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeagueCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/{code}/:
    get:
      operationId: v1_leagues_retrieve
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: League details (members only)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
    delete:
      operationId: v1_leagues_destroy
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Delete a league (owner)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/{code}/leave/:
    post:
      operationId: v1_leagues_leave_create
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Leave a league
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/{code}/members/{user_id}/:
    delete:
      operationId: v1_leagues_members_destroy
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Remove a member (owner)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/{code}/renew-code/:
    post:
      operationId: v1_leagues_renew_code_create
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Renew the invite code (owner); the old code stops working
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/{code}/rounds/{year}/{round}/picks/:
    get:
      operationId: v1_leagues_rounds_picks_list
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: All members' picks for a round (after predictions close)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: round
        schema:
          type: integer
        required: true
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberPick'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/leagues/join/:
    post:
      operationId: v1_leagues_join_create
      description: Turn domain errors into {"detail", "code"} responses with the right
        status.
      summary: Join a league by invite code (max 50 members)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueJoin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeagueJoin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeagueJoin'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionError'
          description: ''
  /api/v1/notifications/unsubscribe/{token}/:
    get:
      operationId: notifications_unsubscribe_get
      description: |-
        One-click unsubscribe from the link in e-mails: no login, the token is the credential.

        Both verbs unsubscribe (idempotent): GET serves the plain link in the mail, POST serves RFC 8058
        one-click clients. No session is used, so CSRF does not apply. Opting out is the safe direction,
        so a link prefetcher triggering it is harmless.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResult'
          description: ''
    post:
      operationId: notifications_unsubscribe_post
      description: |-
        One-click unsubscribe from the link in e-mails: no login, the token is the credential.

        Both verbs unsubscribe (idempotent): GET serves the plain link in the mail, POST serves RFC 8058
        one-click clients. No session is used, so CSRF does not apply. Opting out is the safe direction,
        so a link prefetcher triggering it is harmless.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
