          type: string
          readOnly: true
          nullable: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        email_verified:
          type: boolean
          readOnly: true
        can_predict:
          type: boolean
          readOnly: true
        timezone:
          type: string
          readOnly: true
        theme:
          allOf:
          - $ref: '#/components/schemas/UserThemeEnum'
          readOnly: true
        is_demo:
          type: boolean
          readOnly: true
        race_result_email:
          type: boolean
          readOnly: true
      required:
      - can_predict
      - display_name
      - email
      - email_verified
      - id
      - is_demo
      - race_result_email
      - theme
      - timezone
    UserThemeEnum:
      enum:
      - system
      - light
      - dark
      type: string
      description: |-
        * `system` - System
        * `light` - Light
        * `dark` - Dark
    Weather:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionHeader'
        total_samples:
          type: integer
          description: Samples stored before downsampling.
        samples:
          type: array
          items:
            $ref: '#/components/schemas/WeatherSample'
      required:
      - samples
      - session
      - total_samples
    WeatherSample:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        air_temperature:
          type: number
          format: double
          nullable: true
        track_temperature:
          type: number
          format: double
          nullable: true
        humidity:
          type: number
          format: double
          nullable: true
        pressure:
          type: number
          format: double
          nullable: true
        wind_speed:
          type: number
          format: double
          nullable: true
        wind_direction:
          type: integer
          nullable: true
        rainfall:
          type: boolean
      required:
      - air_temperature
      - humidity
      - pressure
      - rainfall
      - track_temperature
      - ts
      - wind_direction
      - wind_speed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
