components:
  schemas:
    Calendar:
      type: object
      properties:
        year:
          type: integer
          nullable: true
        next_round:
          allOf:
          - $ref: '#/components/schemas/NextRound'
          nullable: true
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEntry'
      required:
      - next_round
      - rounds
      - year
    CalendarCircuit:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        country:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA name of the circuit.
      required:
      - country
      - locality
      - name
      - slug
      - timezone
    CalendarEntry:
      type: object
      properties:
        round:
          type: integer
          nullable: true
        name:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          description: completed, next, upcoming or cancelled.
        is_next:
          type: boolean
        has_sprint:
          type: boolean
        race_start_utc:
          type: string
          format: date-time
          nullable: true
          description: Countdown target; null when the race time is unknown.
        circuit:
          $ref: '#/components/schemas/CalendarCircuit'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/CalendarSession'
          description: Only sessions that exist.
        winner:
          allOf:
          - $ref: '#/components/schemas/CalendarWinner'
          nullable: true
          description: Null until results exist.
      required:
      - circuit
      - date
      - has_sprint
      - is_next
      - name
      - race_start_utc
      - round
      - sessions
      - status
      - winner
    CalendarRound:
      type: object
      properties:
        round:
          type: integer
          nullable: true
        name:
          type: string
        date:
          type: string
          format: date
        is_cancelled:
          type: boolean
        has_sprint:
          type: boolean
        circuit:
          $ref: '#/components/schemas/CircuitRef'
        winner:
          allOf:
          - $ref: '#/components/schemas/RoundWinner'
          nullable: true
          description: Null for upcoming rounds.
      required:
      - circuit
      - date
      - has_sprint
      - is_cancelled
      - name
      - round
      - winner
    CalendarSession:
      type: object
      properties:
        type:
          type: string
