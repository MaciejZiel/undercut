[project]
name = "undercut-backend"
version = "0.1.0"
description = "Undercut backend (Django modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<7",
    "django-allauth[headless]==65.19.6",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2",
    "tzdata>=2025.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-queryguard[django]==1.0.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
# N+1 gate (pytest-queryguard, see docs/n-plus-one.md): a lazy relationship load or a statement
# repeated in a loop fails the test. The rules below are reviewed exceptions, one reason each.
queryguard_ignore = [
    # Import pipeline: idempotent per-entity upserts run by the worker after a session or by the
    # one-off history import (about 30 s for 1950-today). Bounded by one round's rows.
    "repeated-statement * file=apps/catalog/services.py function=_sync",
    "repeated-statement * file=apps/catalog/services.py function=_ids",
    "repeated-statement * file=apps/catalog/services.py function=_create_with_slug",
    "repeated-statement * file=apps/catalog/services.py function=_bulk_sync",
    "repeated-statement * file=apps/catalog/services.py function=upsert_constructor_season",
    # OpenF1 import matches a session's drivers once per imported session (two queries).
    "repeated-statement * file=apps/catalog/services.py function=_driver_refs",
    "repeated-statement * file=apps/ingestion/openf1/matching.py function=resolve_drivers",
    # Post-race e-mail: each recipient is re-checked and marked in its own transaction on
    # purpose (exactly-once per user and round); SMTP, not the database, is the cost here.
    "repeated-statement * file=apps/notifications/handlers.py function=_send_one",
    "repeated-statement * file=apps/accounts/selectors_public.py function=get_race_email_recipient",
    # Demo reset: one driver pool per sample round, at most three rounds.
    "repeated-statement * file=apps/catalog/summaries.py function=grid_driver_ids",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.importlinter]
root_packages = ["apps"]

# Modules talk through events and public interfaces (services, selectors, api), never through
# each other's models or admin. One contract per module keeps violations easy to read.

[[tool.importlinter.contracts]]
name = "catalog does not reach into other modules' models"
type = "forbidden"
source_modules = ["apps.catalog"]
forbidden_modules = [
    "apps.ingestion.models",
    "apps.standings.models",
    "apps.analytics.models",
    "apps.predictions.models",
    "apps.notifications.models",
]
allow_indirect_imports = true

