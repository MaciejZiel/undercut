[project]
name = "undercut-backend"
version = "0.1.0"
description = "Undercut backend (Django modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<7",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.importlinter]
root_packages = ["apps"]

# Modules talk through events and public interfaces, never through each other's internals.
[[tool.importlinter.contracts]]
name = "Domain modules are independent"
type = "independence"
modules = [
    "apps.catalog",
    "apps.ingestion",
    "apps.standings",
    "apps.analytics",
    "apps.predictions",
    "apps.notifications",
]
