name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: undercut
          POSTGRES_USER: undercut
          POSTGRES_PASSWORD: undercut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U undercut -d undercut"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://undercut:undercut@localhost:5432/undercut
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Type check (errors may not rise above the baseline)
        run: |
          npm install --global pyright@1.1.414
          uv run python scripts/typecheck_ratchet.py
      - run: uv run pytest -q --cov=apps --cov-report=term --cov-fail-under=90 --queryguard-json=queryguard.json
      - name: Upload per-test query counts (pytest-queryguard)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: queryguard
          path: backend/queryguard.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
