name: E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:8080
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for the stack
        run: bash scripts/e2e/write-env.sh

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the stack
        run: bash scripts/e2e/wait-for-stack.sh

      - name: Load history, one race of analytics and the seed
        run: bash scripts/e2e/load-data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200
